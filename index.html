<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CheckStudio Pro PWA</title>
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22CheckStudio%20Pro%22%2C%22short_name%22%3A%22CheckStudio%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231E1E24%22%2C%22theme_color%22%3A%22%231E1E24%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fpng%3Bbase64%2CiVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg%3D%3D%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Caveat:wght@400;700&display=swap');
        @font-face {
            font-family: 'MICR';
            src: local('Courier New');
        }

        :root {
            --bg: #121212;
            --panel: #1E1E24;
            --border: #333;
            --text: #E0E0E0;
            --accent: #4CAF50;
            --danger: #F44336;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header */
        header { background: var(--panel); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; }
        header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
        .actions { display: flex; gap: 8px; }
        button { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: #444; }
        button.primary { background: var(--accent); color: #000; }
        button.primary:hover { background: #5CBF60; }

        /* Main Layout */
        .main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* Sidebar Controls */
        .sidebar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; z-index: 10; }
        .section { padding: 16px; border-bottom: 1px solid var(--border); }
        .section h3 { font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 12px; letter-spacing: 1px; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
        input[type="text"], input[type="number"], select { width: 100%; background: #111; border: 1px solid #333; color: white; padding: 8px; border-radius: 4px; font-family: inherit; font-size: 13px; }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .row { display: flex; gap: 8px; }
        .row > * { flex: 1; }
        
        /* Canvas Area */
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: auto; background: #0a0a0a; position: relative; }
        
        /* Check Paper */
        .paper-container { position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: white; transform-origin: center center; }
        canvas { display: block; }
        
        /* Draggable Overlays */
        .overlay { position: absolute; border: 1px dashed transparent; cursor: move; padding: 2px; }
        .overlay:hover, .overlay.active { border-color: rgba(0, 150, 255, 0.5); background: rgba(0, 150, 255, 0.05); }
        .overlay .text { white-space: pre; display: block; }
        .resize-handle { position: absolute; right: -4px; bottom: -4px; width: 12px; height: 12px; background: rgba(0, 150, 255, 0.8); border-radius: 50%; cursor: se-resize; display: none; }
        .overlay.active .resize-handle { display: block; }

        /* Print CSS */
        @media print {
            body { background: white; height: auto; overflow: visible; }
            header, .sidebar { display: none !important; }
            .main { display: block; height: auto; }
            .workspace { padding: 0; background: white; display: block; overflow: visible; }
            .paper-container { box-shadow: none; transform: none !important; margin: 0; }
            .overlay { border: none !important; background: none !important; }
            .overlay .text { color: black !important; }
            .resize-handle { display: none !important; }
            
            /* Dynamic Page Size injected via JS */
            @page { size: var(--page-size, 6in 2.75in); margin: 0; }
        }
    </style>
</head>
<body>

<header>
    <h1>CheckStudio Pro</h1>
    <div class="actions">
        <button onclick="toggleBack()">Flip Check</button>
        <button class="primary" onclick="window.print()">Print / Save PDF</button>
    </div>
</header>

<div class="main">
    <div class="sidebar">
        <div class="section">
            <h3>Bank Template</h3>
            <select id="bankSelect" onchange="loadBank()">
                <option value="chase">JPMorgan Chase</option>
                <option value="wells">Wells Fargo</option>
                <option value="boa">Bank of America</option>
                <option value="citi">Citibank</option>
                <option value="ally">Ally Bank</option>
                <option value="blank">Blank Canvas</option>
            </select>
        </div>

        <div class="section">
            <h3>Check Size</h3>
            <select id="sizeSelect" onchange="setSize()">
                <option value="personal">Personal (6 x 2.75 in)</option>
                <option value="business">Business (8.5 x 3.5 in)</option>
                <option value="wallet">Wallet (6 x 2.75 in)</option>
            </select>
        </div>

        <div class="section">
            <h3>Background & Logo</h3>
            <input type="file" id="bgUpload" accept="image/*" style="display:none" onchange="uploadImage(event, 'bg')">
            <input type="file" id="logoUpload" accept="image/*" style="display:none" onchange="uploadImage(event, 'logo')">
            <div class="row">
                <button onclick="document.getElementById('bgUpload').click()">Upload Bg</button>
                <button onclick="document.getElementById('logoUpload').click()">Upload Logo</button>
            </div>
        </div>

        <div class="section" id="fieldEditor">
            <h3>Edit Field</h3>
            <div class="input-group">
                <label>Text Content</label>
                <input type="text" id="fieldText" oninput="updateFieldText(this.value)">
            </div>
            <div class="row">
                <div class="input-group">
                    <label>Font Size (pt)</label>
                    <input type="number" id="fieldSize" onchange="updateFieldStyle('size', this.value)">
                </div>
                <div class="input-group">
                    <label>Color</label>
                    <input type="color" id="fieldColor" value="#000000" onchange="updateFieldStyle('color', this.value)">
                </div>
            </div>
            <div class="input-group">
                <label>Font Family</label>
                <select id="fieldFont" onchange="updateFieldStyle('font', this.value)">
                    <option value="Inter">Sans-Serif (System)</option>
                    <option value="'Caveat', cursive">Handwriting (Signature)</option>
                    <option value="'Courier New', monospace">Monospace (MICR)</option>
                    <option value="Times New Roman">Serif</option>
                </select>
            </div>
        </div>
        
        <div class="section">
            <h3>Security Features</h3>
            <div class="input-group">
                <label><input type="checkbox" id="microprint" onchange="toggleMicroprint()"> Microprint Border</label>
            </div>
            <div class="input-group">
                <label><input type="checkbox" id="voidWatermark" onchange="toggleVoid()"> "VOID" Watermark</label>
            </div>
        </div>
    </div>

    <div class="workspace" id="workspace">
        <div class="paper-container" id="paperContainer" style="width: 1800px; height: 825px;">
            <canvas id="checkCanvas" width="1800" height="825"></canvas>
        </div>
    </div>
</div>

<script>
// ---------- State ----------
let state = {
    size: 'personal',
    isBack: false,
    bank: 'chase',
    bgImage: null,
    logoImage: null,
    microprint: false,
    voidWatermark: false,
    fields: {}
};

const fieldDefaults = {
    personal: {
        bankName: { x: 0.25, y: 0.35, text: 'JPMorgan Chase', font: 'Inter', size: 20, color: '#000000', bold: true },
        bankAddr: { x: 0.25, y: 0.50, text: '270 Park Ave, New York, NY 10017', font: 'Inter', size: 9, color: '#333333' },
        payee: { x: 1.5, y: 0.85, text: '', font: 'Inter', size: 12, color: '#000000' },
        amountNum: { x: 4.8, y: 0.85, text: '$', font: 'Inter', size: 14, color: '#000000' },
        amountWords: { x: 1.5, y: 1.15, text: 'Zero and 00/100', font: 'Inter', size: 11, color: '#000000' },
        date: { x: 4.7, y: 0.35, text: 'MM/DD/YYYY', font: 'Inter', size: 11, color: '#000000' },
        memo: { x: 0.70, y: 1.85, text: '', font: 'Inter', size: 10, color: '#000000' },
        sigLine: { x: 4.5, y: 1.85, text: 'AUTHORIZED SIGNATURE', font: 'Inter', size: 8, color: '#000000' },
        checkNo: { x: 5.5, y: 0.35, text: '1001', font: 'Inter', size: 10, color: '#000000' },
        micr: { x: 0.25, y: 2.45, text: '⑆000000000⑆ ⑈0000000000⑈ ⑆1001', font: "'Courier New', monospace", size: 14, color: '#000000', bold: true }
    },
    business: {
        bankName: { x: 0.25, y: 0.35, text: 'JPMorgan Chase', font: 'Inter', size: 24, color: '#000000', bold: true },
        bankAddr: { x: 0.25, y: 0.50, text: '270 Park Ave, New York, NY 10017', font: 'Inter', size: 11, color: '#333333' },
        payee: { x: 1.5, y: 0.85, text: '', font: 'Inter', size: 14, color: '#000000' },
        amountNum: { x: 7.3, y: 0.85, text: '$', font: 'Inter', size: 16, color: '#000000' },
        amountWords: { x: 1.5, y: 1.15, text: 'Zero and 00/100', font: 'Inter', size: 12, color: '#000000' },
        date: { x: 7.2, y: 0.35, text: 'MM/DD/YYYY', font: 'Inter', size: 12, color: '#000000' },
        memo: { x: 0.70, y: 2.50, text: '', font: 'Inter', size: 12, color: '#000000' },
        sigLine: { x: 6.5, y: 2.50, text: 'AUTHORIZED SIGNATURE', font: 'Inter', size: 9, color: '#000000' },
        checkNo: { x: 8.0, y: 0.35, text: '1001', font: 'Inter', size: 12, color: '#000000' },
        micr: { x: 0.25, y: 3.20, text: '⑆000000000⑆ ⑈0000000000⑈ ⑆1001', font: "'Courier New', monospace", size: 14, color: '#000000', bold: true }
    }
};

// ---------- Initialization ----------
function init() {
    setSize();
    loadBank();
    window.addEventListener('resize', () => render());
}

function setSize() {
    state.size = document.getElementById('sizeSelect').value;
    const container = document.getElementById('paperContainer');
    const canvas = document.getElementById('checkCanvas');
    
    let wIn = 6, hIn = 2.75;
    if (state.size === 'business') { wIn = 8.5; hIn = 3.5; }
    
    // 300 DPI for crisp print
    const pxW = wIn * 300;
    const pxH = hIn * 300;
    
    canvas.width = pxW;
    canvas.height = pxH;
    
    // Scale down for screen preview (fit within 800px width max)
    const scale = Math.min((window.innerWidth - 400) / pxW, (window.innerHeight - 100) / pxH, 1);
    container.style.width = pxW + 'px';
    container.style.height = pxH + 'px';
    container.style.transform = `scale(${scale})`;

    // Update CSS print var
    document.documentElement.style.setProperty('--page-size', `${wIn}in ${hIn}in`);

    loadBank();
}

function loadBank() {
    state.bank = document.getElementById('bankSelect').value;
    state.isBack = false;
    
    // Define real layouts here
    const base = JSON.parse(JSON.stringify(fieldDefaults[state.size] || fieldDefaults.personal));
    
    if (state.bank === 'wells') {
        base.bankName.text = 'WELLS FARGO';
        base.bankAddr.text = '420 Montgomery St, San Francisco, CA 94104';
    } else if (state.bank === 'boa') {
        base.bankName.text = 'Bank of America';
        base.bankAddr.text = '100 N Tryon St, Charlotte, NC 28202';
    } else if (state.bank === 'citi') {
        base.bankName.text = 'Citibank';
        base.bankAddr.text = '388 Greenwich St, New York, NY 10013';
    } else if (state.bank === 'ally') {
        base.bankName.text = 'ally';
        base.bankAddr.text = 'P.O. Box 951, Horsham, PA 19044';
    } else if (state.bank === 'blank') {
        base.bankName.text = 'Bank Name';
        base.bankAddr.text = 'Bank Address';
    }

    state.fields = base;
    buildOverlays();
    render();
}

// ---------- Render ----------
function render() {
    const canvas = document.getElementById('checkCanvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, w, h);

    // Draw Uploaded Background
    if (state.bgImage) {
        ctx.drawImage(state.bgImage, 0, 0, w, h);
    }

    // Draw Background Lines & Boxes (Always visible)
    if (!state.isBack) {
        ctx.strokeStyle = '#CCCCCC';
        ctx.lineWidth = 2;
        const scale = 300; // px per inch

        // Underline Payee
        ctx.beginPath(); ctx.moveTo(1.5 * scale, 0.9 * scale); ctx.lineTo(4.5 * scale, 0.9 * scale); ctx.stroke();
        // Box Amount
        ctx.strokeRect(4.7 * scale, 0.65 * scale, 0.9 * scale, 0.3 * scale);
        // Underline Words
        ctx.beginPath(); ctx.moveTo(1.5 * scale, 1.2 * scale); ctx.lineTo(4.5 * scale, 1.2 * scale); ctx.stroke();
        // Underline Memo
        ctx.beginPath(); ctx.moveTo(0.7 * scale, 1.9 * scale); ctx.lineTo(2.5 * scale, 1.9 * scale); ctx.stroke();
        // Signature Line
        ctx.strokeStyle = '#000000';
        ctx.beginPath(); ctx.moveTo(4.5 * scale, 1.95 * scale); ctx.lineTo((w/scale) - 0.25 * scale, 1.95 * scale); ctx.stroke();

        // Microprint
        if (state.microprint) {
            ctx.font = '4px Inter';
            ctx.fillStyle = '#888888';
            ctx.fillText('SECURITY MICROPRINT BORDER '.repeat(20), 20, 20);
            ctx.fillText('SECURITY MICROPRINT BORDER '.repeat(20), 20, h - 20);
        }

        // Void Watermark
        if (state.voidWatermark) {
            ctx.save();
            ctx.translate(w/2, h/2);
            ctx.rotate(-Math.PI / 6);
            ctx.font = 'bold 100px Inter';
            ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
            ctx.textAlign = 'center';
            ctx.fillText('VOID', 0, 0);
            ctx.restore();
        }

        // Header Logo
        if (state.logoImage) {
            // We let user drag logo later, for now just draw top left
            ctx.drawImage(state.logoImage, 0.25 * 300, 0.1 * 300, 120, 60);
        }
    } else {
        // Back Side Rendering
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 40px Inter';
        ctx.fillText('ENDORSE HERE', 0.25 * 300, 0.6 * 300);
        
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0.25 * 300, 0.7 * 300); ctx.lineTo((w/300 - 0.25) * 300, 0.7 * 300); ctx.stroke();
        
        ctx.font = '24px Inter';
        ctx.fillText('DO NOT WRITE, STAMP OR SIGN BELOW THIS LINE', 0.25 * 300, 1.2 * 300);
        ctx.beginPath(); ctx.moveTo(0.25 * 300, 1.3 * 300); ctx.lineTo((w/300 - 0.25) * 300, 1.3 * 300); ctx.stroke();

        ctx.strokeRect(0.25 * 300, 1.5 * 300, 0.2 * 300, 0.2 * 300);
        ctx.font = '20px Inter';
        ctx.fillText('CHECK HERE FOR MOBILE DEPOSIT', 0.6 * 300, 1.65 * 300);
    }
}

// ---------- Interactive Fields (Drag & Drop) ----------
function buildOverlays() {
    const container = document.getElementById('paperContainer');
    // Clear existing overlays
    document.querySelectorAll('.overlay').forEach(e => e.remove());

    Object.keys(state.fields).forEach(key => {
        const data = state.fields[key];
        const div = document.createElement('div');
        div.className = 'overlay';
        div.id = 'ov_' + key;
        
        // Position based on inches * 300 DPI
        div.style.left = (data.x * 300) + 'px';
        div.style.top = (data.y * 300) + 'px';
        
        const span = document.createElement('span');
        span.className = 'text';
        span.innerText = data.text;
        span.style.fontFamily = data.font;
        span.style.fontSize = (data.size * 300 / 72) + 'px'; // Convert pt to px at 300 DPI
        span.style.color = data.color;
        span.style.fontWeight = data.bold ? 'bold' : 'normal';
        
        const resize = document.createElement('div');
        resize.className = 'resize-handle';
        
        div.appendChild(span);
        div.appendChild(resize);
        container.appendChild(div);

        // Make Draggable
        let isDragging = false;
        let startX, startY, origX, origY;

        div.addEventListener('mousedown', (e) => {
            if (e.target === resize) return; // Handled by resize
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            origX = data.x;
            origY = data.y;
            selectField(key);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = (e.clientX - startX) / 300; // Convert px delta to inches
            const dy = (e.clientY - startY) / 300;
            data.x = origX + dx;
            data.y = origY + dy;
            div.style.left = (data.x * 300) + 'px';
            div.style.top = (data.y * 300) + 'px';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Make Resizable
        let isResizing = false;
        let startFontSize;

        resize.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            isResizing = true;
            startX = e.clientX;
            startFontSize = data.size;
            selectField(key);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const dx = e.clientX - startX;
            data.size = Math.max(4, startFontSize + (dx / 10));
            span.style.fontSize = (data.size * 300 / 72) + 'px';
        });

        window.addEventListener('mouseup', () => {
            isResizing = false;
        });
    });
}

let activeFieldKey = null;

function selectField(key) {
    activeFieldKey = key;
    document.querySelectorAll('.overlay').forEach(e => e.classList.remove('active'));
    const el = document.getElementById('ov_' + key);
    if (el) el.classList.add('active');

    const data = state.fields[key];
    document.getElementById('fieldText').value = data.text;
    document.getElementById('fieldSize').value = data.size;
    document.getElementById('fieldColor').value = data.color;
    document.getElementById('fieldFont').value = data.font;
}

function updateFieldText(val) {
    if (!activeFieldKey) return;
    state.fields[activeFieldKey].text = val;
    document.querySelector('#ov_' + activeFieldKey + ' .text').innerText = val;
    
    // Auto-update amount to words
    if (activeFieldKey === 'amountNum') {
        const num = parseFloat(val.replace('$', '')) || 0;
        state.fields['amountWords'].text = numToWords(num);
        document.querySelector('#ov_amountWords .text').innerText = state.fields['amountWords'].text;
    }
}

function updateFieldStyle(prop, val) {
    if (!activeFieldKey) return;
    const data = state.fields[activeFieldKey];
    const span = document.querySelector('#ov_' + activeFieldKey + ' .text');

    if (prop === 'size') {
        data.size = parseFloat(val);
        span.style.fontSize = (data.size * 300 / 72) + 'px';
    } else if (prop === 'color') {
        data.color = val;
        span.style.color = val;
    } else if (prop === 'font') {
        data.font = val;
        span.style.fontFamily = val;
    }
}

// ---------- Image Uploads ----------
function uploadImage(event, type) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            if (type === 'bg') state.bgImage = img;
            if (type === 'logo') state.logoImage = img;
            render();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

// ---------- Misc Controls ----------
function toggleBack() {
    state.isBack = !state.isBack;
    if (state.isBack) {
        document.querySelectorAll('.overlay').forEach(e => e.style.display = 'none');
    } else {
        document.querySelectorAll('.overlay').forEach(e => e.style.display = 'block');
    }
    render();
}

function toggleMicroprint() {
    state.microprint = document.getElementById('microprint').checked;
    render();
}

function toggleVoid() {
    state.voidWatermark = document.getElementById('voidWatermark').checked;
    render();
}

// ---------- Amount to Words ----------
const ONES = ['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

function numToWords(n) {
    if (n === 0) return 'Zero and 00/100';
    const dollars = Math.floor(n);
    const cents = Math.round((n - dollars) * 100);
    return chunk(dollars) + ' and ' + String(cents).padStart(2, '0') + '/100';
}

function chunk(n) {
    if (n === 0) return '';
    if (n < 20) return ONES[n];
    if (n < 100) return TENS[Math.floor(n/10)] + (n%10 ? '-' + ONES[n%10] : '');
    if (n < 1000) return ONES[Math.floor(n/100)] + ' hundred ' + chunk(n%100);
    if (n < 1000000) return chunk(Math.floor(n/1000)) + ' thousand ' + chunk(n%1000);
    return 'AMOUNT TOO LARGE';
}

// Start
init();
</script>
</body>
</html>
